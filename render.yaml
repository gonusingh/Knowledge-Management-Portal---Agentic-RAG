services:
  - type: web
    name: knowledge-management-portal-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_render.py
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: PUBLIC_ROLE_SELECTOR
        value: "true"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: GUARDRAIL_DEBUG_LOGGING
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_SHARED_SECRET
        sync: false
