services:
  - type: web
    name: knowledge-management-portal-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: PUBLIC_ROLE_SELECTOR
        value: "true"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: GUARDRAIL_DEBUG_LOGGING
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_SHARED_SECRET
        sync: false
